name: Gerar APK Android (TeclaTV Bluetooth)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências Node
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Compilar frontend e sincronizar Capacitor
        run: npm run build && npx cap sync android

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Gerar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: TeclaTV-Bluetooth-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
