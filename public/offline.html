<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TelaLivre — Sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f8fa;
        color: #101828;
      }
      .card {
        max-width: 380px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e4e7ec;
        border-radius: 16px;
        padding: 28px;
        text-align: center;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #475467;
      }
      button {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-radius: 12px;
        background: #1d4ed8;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/pwa-192x192.png" alt="TelaLivre" width="56" height="56" style="border-radius: 12px" />
      <h1>Você está sem conexão</h1>
      <p>Conecte o celular à mesma rede Wi-Fi da sua Smart TV para procurar e espelhar a tela.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
